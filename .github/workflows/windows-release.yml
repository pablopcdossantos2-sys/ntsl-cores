name: Build and publish Windows release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (for example v1.0.0)"
        required: true
        default: "v1.0.0"
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python source
        run: python -m py_compile main.py

      - name: Install application dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Generate application icon
        run: python scripts/generate_icon.py

      - name: Build portable executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name NTSL-Cores --icon assets/NTSL-Cores.ico --add-data "assets/NTSL-Cores.ico;assets" main.py

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          name: NTSL Cores ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          generate_release_notes: true
          files: dist/NTSL-Cores.exe
          fail_on_unmatched_files: true
